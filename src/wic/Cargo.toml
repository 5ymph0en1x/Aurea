[package]
name = "aurea-wic"
version = "0.1.0"
edition = "2021"

[lib]
name = "aurea_wic"
crate-type = ["cdylib"]

[dependencies]
aurea-core = { path = "../core" }
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
]
